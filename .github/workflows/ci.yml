name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[web,mcp]"
      - run: python tests/test_junk.py
      - run: python tests/test_ratelimit.py
      - run: python tests/test_quota.py
      - run: python tests/test_sense.py
      - run: python tests/test_fuse.py
      - run: python tests/test_web.py
      - run: python -c "import omnisearch.web, omnisearch.mcp_server, omnisearch.cli"
