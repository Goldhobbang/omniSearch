# omniSearch 로컬 SearXNG 설정. 기본값 위에 필요한 것만 덮어씀.
# secret_key는 start.sh가 SEARXNG_SECRET 환경변수로 주입.
use_default_settings: true

general:
  instance_name: omniSearch-local

server:
  bind_address: "127.0.0.1"
  port: 8888
  limiter: false
  public_instance: false

search:
  formats:
    - html
    - json

outgoing:
  # 전역 업스트림 대기 상한. 2.0으로 낮추면 빈 결과가 늘어나는 것이 실측되어
  # 기본 3.0 유지 (영구 사망 엔진은 아래에서 비활성화).
  request_timeout: 3.0

engines:
  - name: naver
    disabled: false
  # 실측 사망 엔진 (unresponsive_engines 5/5 프로브):
  # brave.* = 상시 rate-limit, google news = access denied, reuters = 상시 timeout.
  # naver/ddg/wikipedia는 일시적 timeout이라 유지 (한글·즉답 가치).
  - name: brave
    disabled: true
  - name: brave.news
    disabled: true
  - name: google news
    disabled: true
  - name: reuters
    disabled: true
